# ==========================================
# carlos-workflow-cloud 微服务启动配置
# 说明：工作流审批中心 Spring Cloud 版本，通过 Nacos 获取共享配置
# ==========================================

# ======================== 服务基础配置 ========================
server:
  port: ${SERVER_PORT:9518}

# ======================== Spring 主配置 ========================
spring:
  profiles:
    active: ${PROFILE:local}
  application:
    name: carlos-workflow

  # ======================== Nacos 配置中心 ========================
  cloud:
    nacos:
      discovery:
        enabled: true
      config:
        enabled: true
        file-extension: yml
        refresh-enabled: true
    openfeign:
      okhttp:
        enabled: false
      httpclient:
        enabled: true
        max-connections: 200
        max-connections-per-route: 50
        connection-timeout: 3000
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 30000
            logger-level: BASIC

  # 配置导入（Nacos 共享配置）
  config:
    import:
      # 1. 公共配置（所有环境共享）
      # 2. 数据库共享配置
      - optional:nacos:common.yml?group=DEFAULT_GROUP&refreshEnabled=true
      - optional:nacos:db.yml?group=DEFAULT_GROUP&refreshEnabled=true
      - optional:nacos:redis.yml?group=DEFAULT_GROUP&refreshEnabled=true

# ======================== 本地调试环境 ========================
---
spring:
  config:
    activate:
      on-profile: local
  cloud:
    nacos:
      username: ${NACOS_USERNAME:@nacos.username@}
      password: ${NACOS_PASSWORD:@nacos.password@}
      discovery:
        server-addr: ${NACOS_ADDR:@nacos.addr@}
        namespace: ${NACOS_NAMESPACE:@nacos.namespace@}
        group: ${NACOS_GROUP:@nacos.group@}
      config:
        server-addr: ${NACOS_ADDR:@nacos.addr@}
        namespace: ${NACOS_NAMESPACE:@nacos.namespace@}
        group: ${NACOS_GROUP:@nacos.group@}

# ======================== 部署环境（使用环境变量） ========================
---
spring:
  config:
    activate:
      on-profile: deploy
  cloud:
    nacos:
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        server-addr: ${NACOS_ADDR}
        namespace: ${NACOS_NAMESPACE}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
      config:
        server-addr: ${NACOS_ADDR}
        namespace: ${NACOS_NAMESPACE}
        group: ${NACOS_GROUP:DEFAULT_GROUP}

# ======================== 数据源配置（Druid + 动态数据源） ========================
# 连接信息由 Nacos 的 db.yml 下发（spring.datasource.dynamic.datasource.master.*，主库名固定 master），
# 这里只放连接池参数，与 carlos-job-cloud 保持同一形状。
---
spring:
  datasource:
    druid:
      stat-view-servlet:
        enabled: true
        # 控制台口令必须走环境变量，禁止默认弱口令
        loginUsername: ${DRUID_CONSOLE_USERNAME:admin}
        loginPassword: ${DRUID_CONSOLE_PASSWORD:}
    dynamic:
      primary: master
      druid:
        time-between-connect-error-millis: 10000
        break-after-acquire-failure: false
        fail-fast: true
        connection-error-retry-attempts: 10
        initial-size: 20
        min-idle: 20
        max-active: 100
        max-wait: 10000
        time-between-eviction-runs-millis: 60000
        min-evictable-idle-time-millis: 300000
        validation-query: SELECT 1
        test-while-idle: true
        test-on-borrow: false
        test-on-return: false
        pool-prepared-statements: true
        max-pool-prepared-statement-per-connection-size: 20
        filters: stat,wall,slf4j
        connection-properties:
          druid.stat.mergeSql: true
          druid.stat.slowSqlMillis: 5000

# ======================== Carlos 框架配置 ========================
---
carlos:
  # ======================== 资源服务器/安全配置 ========================
  # 开启后挂载 UserContextAuthenticationFilter：校验网关签发的身份断言（X-User-Context），
  # 并在本服务内建立登录人上下文。这是 @Log 审计日志能记录「操作人」的前提 ——
  # 关闭时审计行会记成 principalType=ANONYMOUS、操作人为空。
  # 注意：该过滤器链是 anyRequest().permitAll()，不收紧任何准入；准入权威仍在网关。
  resource-server:
    enabled: true
  web:
    cors:
      enabled: true
    enum-dict:
      # 只扫本服务自己的枚举包（@AppEnum 的 code 需全局唯一，扫 com.carlos 会跨模块互相覆盖）
      scan-packages: com.carlos.workflow
      enabled: true
    # 见 carlos-workflow-boot/application.yml 的同类配置：必须排除 Warm-Flow 的控制器，
    # 否则 Carlos 的统一响应包装会把引擎的 ApiResult 再包一层，设计器解析不了（顶层 code 变成 "00000"）。
    response-wrap:
      exclude-packages:
        - org.dromara.warm.flow.ui
      exclude-paths:
        - /warm-flow/**
        - /warm-flow-ui/**
  # ======================== 工作流配置 ========================
  workflow:
    enabled: true

  # ======================== MyBatis 配置 ========================
  mybatis:
    # 分页方言，必须与真实数据库一致。框架默认 POSTGRE_SQL；达梦（DM）必须显式改成 dm，
    # 否则 MyBatis-Plus 按 PostgreSQL 语法拼分页 SQL，Warm-Flow 自带的分页接口会直接报错。
    # 这里用环境变量占位而不是写死，是因为 spring.config.import 场景下本地文档优先级高于
    # Nacos 导入源：写死会把 Nacos 下发的 dm 覆盖回去（与 carlos-job-cloud 的 access-token 同一坑）。
    db-type: ${CARLOS_MYBATIS_DB_TYPE:POSTGRE_SQL}

# ======================== Warm-Flow 引擎配置 ========================
warm-flow:
  enabled: true
  ui: true
  banner: false
  # 必须保持为空：该配置项走反射 newInstance，会绕过 Spring 依赖注入
  permission-handler-path:

# ======================== MyBatis-Plus 配置 ========================
mybatis-plus:
  check-config-location: false
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    call-setters-on-nulls: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*Mapper.xml

# ======================== 日志配置 ========================
logging:
  config: classpath:config/logback.xml
  level:
    root: info
    com.carlos: debug
  file:
    path: logs/workflow

