# ==========================================
# carlos-audit-bus 审计模块业务配置
# 说明：审计服务业务层专属配置，用于 Disruptor 队列、ClickHouse 写入、归档等
# ==========================================

# ======================== Carlos Audit 审计日志模块配置 ========================
carlos:
  audit:
    # 是否启用审计日志
    enabled: true

    # ======================== Disruptor 高性能队列配置 ========================
    disruptor:
      # RingBuffer 大小（必须是 2 的幂次）
      buffer-size: 1048576  # 2^20 = 1,048,576
      # 消费者线程数
      consumer-count: 4
      # 等待策略：blocking, busy_spin, lite_blocking, sleeping, yielding
      wait-strategy: blocking
      # 是否启用多生产者模式
      multi-producer: true

    # ======================== ClickHouse 配置 ========================
    clickhouse:
      enabled: true
      # ClickHouse 主机
      host: ${CLICKHOUSE_HOST:localhost}
      # ClickHouse HTTP 端口
      port: ${CLICKHOUSE_PORT:8123}
      # 数据库名
      database: ${CLICKHOUSE_DATABASE:default}
      # 用户名
      username: ${CLICKHOUSE_USERNAME:default}
      # 密码
      password: ${CLICKHOUSE_PASSWORD:}
      # Socket 超时（毫秒）
      socket-timeout: 300000
      # 连接超时（毫秒）
      connection-timeout: 10000

    # ======================== 批量写入配置 ========================
    batch-writer:
      # 批次大小
      batch-size: 500
      # 刷新间隔（毫秒）
      flush-interval: 1000
      # 最大缓冲区大小
      max-buffer-size: 10000
      # 重试次数
      retry-times: 3
      # 失败时是否写入本地文件备份
      local-backup-on-failure: true
      # 本地备份路径
      local-backup-path: ./audit-log-backup

    # ======================== 归档配置 ========================
    archive:
      # 是否启用归档
      enabled: true
      # 冷数据天数（超过此天数的数据将被归档）
      cold-days: 7
      # 归档任务 cron 表达式（每天凌晨 2 点执行）
      cron: "0 0 2 * * ?"
      # 归档文件格式：CSV, PARQUET, JSON
      format: CSV
      # 存储类型：OSS, S3, MINIO, LOCAL
      storage-type: MINIO
      # OSS/MinIO 归档配置
      oss:
        endpoint: ${CARLOS_OSS_ENDPOINT:}
        access-key-id: ${CARLOS_OSS_ACCESS_KEY:}
        access-key-secret: ${CARLOS_OSS_SECRET_KEY:}
        bucket-name: ${CARLOS_OSS_BUCKET_NAME:carlos-audit}
        prefix: audit-logs/

  # ======================== Disruptor 公共配置 ========================
  disruptor:
    enabled: true
    buffer-size: 1024
    wait-strategy: blocking
    thread-pool:
      thread-name-prefix: audit-disruptor-

  # ======================== 日志模块配置 ========================
  log:
    enabled: true
    # 是否异步处理
    async: true
    disruptor:
      ring-buffer-size: 1024
      name: log-disruptor
    # 日志存储配置
    storage:
      # 默认存储方式：logging, db, file
      default-storage: logging
      # 批量写入大小
      batch-size: 100
      # 批量写入超时（毫秒）
      batch-timeout: 100

# ======================== 日志级别配置 ========================
logging:
  level:
    com.carlos.audit: INFO
    com.carlos.audit.disruptor: DEBUG
    com.carlos.audit.clickhouse: DEBUG
    com.carlos.audit.archive: DEBUG
