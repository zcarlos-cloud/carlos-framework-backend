# ==========================================
# carlos-audit-boot 审计模块单体启动配置
# 说明：用于本地单体启动审计服务，连接 ClickHouse 存储审计日志
# ==========================================

# ======================== 服务基础配置 ========================
server:
  port: 9514
  compression:
    # 启用响应压缩
    enabled: true
    # 需要压缩的 MIME 类型
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    # 最小压缩响应大小
    min-response-size: 128KB
  tomcat:
    # 最大工作线程数
    threads:
      max: 32
  servlet:
    context-path: /

# ======================== Spring 主配置 ========================
spring:
  profiles:
    active: env,boot
  servlet:
    multipart:
      # 启用文件上传
      enabled: true
      # 单文件最大限制
      max-file-size: 200MB
      # 一次上传所有文件的最大限制
      max-request-size: 200MB
  application:
    name: carlos-audit

  # ======================== 数据源配置（ClickHouse） ========================
  datasource:
    dynamic:
      primary: master
      # 严格匹配数据源，默认 false。true 未匹配到指定数据源时抛异常，false 使用默认数据源
      strict: false
      # 是否优雅关闭数据源
      grace-destroy: false
      datasource:
        master:
          # ClickHouse JDBC URL，通过环境变量注入
          url: ${CLICKHOUSE_URL:jdbc:clickhouse://localhost:8123/carlos_audit}
          username: ${CLICKHOUSE_USERNAME:default}
          password: ${CLICKHOUSE_PASSWORD:}
          driver-class-name: com.clickhouse.jdbc.ClickHouseDriver
      druid:
        # 连接失败后不中断
        break-after-acquire-failure: false
        fail-fast: true
        connection-error-retry-attempts: 10
        initial-size: 5
        min-idle: 5
        max-active: 600
        max-wait: 60000
        time-between-eviction-runs-millis: 60000
        min-evictable-idle-time-millis: 300000
        validation-query: SELECT 1
        test-while-idle: true
        test-on-borrow: false
        test-on-return: false
        pool-prepared-statements: true
        max-pool-prepared-statement-per-connection-size: 20
        connection-properties:
          druid.stat.mergeSql: false
          druid.stat.slowSqlMillis: 5000
    druid:
      stat-view-servlet:
        # Druid 监控页面
        enabled: true
        loginUsername: admin
        loginPassword: 123456

# ======================== Carlos 框架配置 ========================
carlos:
  # ======================== 资源服务器/安全配置 ========================
  # 开启后挂载 UserContextAuthenticationFilter：校验网关签发的身份断言（X-User-Context），
  # 并在本服务内建立登录人上下文。这是 @Log 审计日志能记录「操作人」的前提 ——
  # 关闭时审计行会记成 principalType=ANONYMOUS、操作人为空。
  # 注意：该过滤器链是 anyRequest().permitAll()，不收紧任何准入；准入权威仍在网关。
  resource-server:
    enabled: true
  # APM 链路追踪（Brave + MDC 日志关联）
  apm:
    enabled: true
  web:
    # 跨域配置
    cors:
      enabled: true
    # 枚举字典配置
    enum-dict:
      # 扫描包路径
      scan-packages: com.carlos.audit
      enabled: true

  # ======================== Disruptor 高性能队列配置 ========================
  disruptor:
    enabled: true
    # RingBuffer 大小，必须是 2 的幂次
    buffer-size: 1024
    # 等待策略：blocking, busy_spin, lite_blocking, sleeping, yielding
    wait-strategy: blocking
    thread-pool:
      thread-name-prefix: audit-disruptor-

  # ======================== 雪花 ID 配置 ========================
  snowflake:
    # 数据中心标识（唯一）
    tag: audit
    # 是否使用系统时钟
    use-system-clock: false

  # ======================== OSS 归档配置 ========================
  oss:
    enabled: false
    # 存储类型：MINIO / OSS / S3
    type: MINIO
    # MinIO/OSS 服务端点
    endpoint: ${CARLOS_OSS_ENDPOINT:}
    # 公网访问端点
    public-endpoint: ${CARLOS_OSS_PUBLIC_ENDPOINT:}
    # 访问密钥
    access-key: ${CARLOS_OSS_ACCESS_KEY:}
    # 秘密密钥
    secret-key: ${CARLOS_OSS_SECRET_KEY:}
    # 默认 Bucket
    bucket-name: ${CARLOS_OSS_BUCKET_NAME:carlos-audit}
    # 是否自动创建 Bucket
    auto-create-bucket: true
    # 预签名 URL 过期时间（秒）
    presigned-url-expires: 3600

# ======================== 监控配置（Actuator） ========================
management:
  endpoints:
    web:
      exposure:
        # 暴露所有端点（生产环境建议按需暴露）
        include: "*"

# ======================== 日志配置 ========================
logging:
  config: classpath:config/logback.xml
  level:
    root: info
    com.carlos: debug
  file:
    path: logs/audit/

---
# ======================== 接口文档配置（Knife4j/SpringDoc） ========================
# 启用 OpenAPI
carlos:
  openapi:
    enable: true
    # 基本信息
    title: "Carlos 审计服务 API 文档"
    description: "审计日志查询与管理接口"
    version: "3.0.0"

    # 联系人信息
    contact:
      name: "技术支持"
      email: "zhujunkeep@gmail.com"
      url: "https://example.com"

    # 许可证信息
    license: "Apache 2.0"
    license-url: "https://www.apache.org/licenses/LICENSE-2.0"

# ==========================================
# Knife4j 核心配置（必须）
# ==========================================
knife4j:
  # 是否启用 Knife4j（生产环境建议关闭）
  enable: true
  # 生产环境安全配置
  production: false
  # 基础认证配置（访问文档页面的登录认证）
  basic:
    enable: false
    username: admin
    password: 123456
  # 个性化配置（界面定制）
  setting:
    language: ZH_CN
    enable-document-manage: true
    enable-swagger-models: true
    swagger-model-name: Swagger Models
    enable-host: true
    enable-request-cache: true
    enable-filter-multipart-apis: true
    enable-filter-multipart-api-method-type: POST
    enable-dynamic-parameter: true
    enable-open-api: true
    enable-search: true
    enable-after-script: true
    enable-group: true
    enable-response-code: true
    enable-reload-cache-parameter: false
    enable-debug: true
    enable-home-custom: false
    home-custom-path: classpath:markdown/home.md
    enable-version: true
    enable-footer: false
    enable-footer-custom: false
    footer-custom-content: "自定义Footer内容"

# ==========================================
# SpringDoc OpenAPI 原生配置（底层依赖）
# ==========================================
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
    resolve-schema-properties: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: list
    display-request-duration: true
  paths-to-exclude: /error, /actuator/**
  cache:
    disabled: false
  show-actuator: false
  show-login-endpoint: false
  # ==================== 接口分组 ====================
  group-configs:
    # Feign 接口（服务间调用）
    -
      group: 'Feign接口'
      displayName: 'Feign 接口（服务间调用）'
      packagesToScan: com.carlos.audit.apiimpl
      pathsToMatch: /**
    # 审计日志管理
    -
      group: '审计日志'
      displayName: '审计日志管理'
      packagesToScan: com.carlos.audit.controller
      pathsToMatch: /**
