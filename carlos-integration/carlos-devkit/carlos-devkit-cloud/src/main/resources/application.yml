# ==========================================
# carlos-devkit-cloud 微服务启动配置
# 说明：开发工具平台 Spring Cloud 版本，通过 Nacos 获取共享配置
# ==========================================

# ======================== 服务基础配置 ========================
server:
  port: ${SERVER_PORT:9520}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 128KB
  tomcat:
    threads:
      max: 32

# ======================== Spring 主配置 ========================
spring:
  profiles:
    active: ${PROFILE:local}
  application:
    name: carlos-devkit

  # ======================== Nacos 配置中心 ========================
  cloud:
    nacos:
      discovery:
        enabled: true
      config:
        enabled: true
        file-extension: yml
        refresh-enabled: true

  # 配置导入（Nacos 共享配置）
  config:
    import:
      # 1. 公共配置（所有环境共享）
      # 2. Redis 共享配置（框架基线装配 RedissonClient，必须可达）
      # 3. 数据库共享配置（开发工具元数据 PostgreSQL，由 Nacos 管理）
      - optional:nacos:common.yml?group=DEFAULT_GROUP&refreshEnabled=true
      - optional:nacos:redis.yml?group=DEFAULT_GROUP&refreshEnabled=true
      - optional:nacos:db.yml?group=DEFAULT_GROUP&refreshEnabled=true
      # 4. 本服务配置
      - optional:nacos:carlos-devkit.yml?group=DEFAULT_GROUP&refreshEnabled=true

# ======================== 本地调试环境 ========================
---
spring:
  config:
    activate:
      on-profile: local
  cloud:
    nacos:
      username: ${NACOS_USERNAME:@nacos.username@}
      password: ${NACOS_PASSWORD:@nacos.password@}
      discovery:
        server-addr: ${NACOS_ADDR:@nacos.addr@}
        namespace: ${NACOS_NAMESPACE:@nacos.namespace@}
        group: ${NACOS_GROUP:@nacos.group@}
      config:
        server-addr: ${NACOS_ADDR:@nacos.addr@}
        namespace: ${NACOS_NAMESPACE:@nacos.namespace@}
        group: ${NACOS_GROUP:@nacos.group@}

# ======================== 部署环境（使用环境变量） ========================
---
spring:
  config:
    activate:
      on-profile: deploy
  cloud:
    nacos:
      username: ${NACOS_USERNAME}
      password: ${NACOS_PASSWORD}
      discovery:
        server-addr: ${NACOS_ADDR}
        namespace: ${NACOS_NAMESPACE}
        group: ${NACOS_GROUP}
      config:
        namespace: ${NACOS_NAMESPACE}
        server-addr: ${NACOS_ADDR}
        group: ${NACOS_GROUP}

---
# ======================== Carlos 开发工具平台配置 ========================
carlos:
  # ======================== 资源服务器/安全配置 ========================
  # 校验网关签发的身份断言（X-User-Context），建立登录人上下文（审计记录操作人的前提）
  resource-server:
    enabled: true
  # ======================== 加密配置（SM4 国密，数据源口令加密必需） ========================
  encrypt:
    sm4:
      enabled: true
      encrypt-mode: cbc
      key: ${CARLOS_ENCRYPT_KEY:asdfghjklmnbvcxz}
      iv: ${CARLOS_ENCRYPT_IV:mnbvcxzpoiuytre1}
  # ======================== 枚举字典配置 ========================
  web:
    enum-dict:
      # 只扫本服务自己的枚举包（@AppEnum 的 code 需全局唯一，扫 com.carlos 会跨模块互相覆盖）
      scan-packages: com.carlos.devkit
      enabled: true
  # ======================== MyBatis 实体 fill 注解启动期校验 ========================
  mybatis:
    entity-packages:
      - com.carlos.devkit
  # ======================== 雪花 ID 配置 ========================
  snowflake:
    tag: devkit
  # ======================== 开发工具平台配置（详见 DevkitProperties） ========================
  devkit:
    max-output-size: 52428800
    max-file-count: 2000
    render-timeout-ms: 10000
    meta-timeout-sec: 10
    template-max-versions: 50

# ======================== MyBatis-Plus 配置 ========================
mybatis-plus:
  check-config-location: false
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    call-setters-on-nulls: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*Mapper.xml

# ======================== 监控配置（Actuator） ========================
management:
  endpoints:
    web:
      exposure:
        include: "*"

# ======================== 日志配置 ========================
logging:
  config: classpath:config/logback.xml
  level:
    com.carlos: debug
    com.carlos.devkit: INFO
  file:
    path: logs/devkit/

---
# ======================== 接口文档配置（Knife4j/SpringDoc） ========================
carlos:
  openapi:
    enable: true
    title: "Carlos 开发工具平台 API 文档"
    description: "代码生成器 / 工程生成器 / 模板管理接口"
    version: "3.0.0"
    contact:
      name: "技术支持"
      email: "13032820513@163.com"
      url: "http://www.zcarlos.com"
    license: "Apache 2.0"
    license-url: "https://www.apache.org/licenses/LICENSE-2.0"

knife4j:
  enable: true
  production: false
  basic:
    enable: false
    username: admin
    password: 123456
  setting:
    language: ZH_CN
    enable-document-manage: true
    enable-swagger-models: true
    swagger-model-name: Swagger Models
    enable-host: true
    enable-request-cache: true
    enable-filter-multipart-apis: true
    enable-filter-multipart-api-method-type: POST
    enable-dynamic-parameter: true
    enable-open-api: true
    enable-search: true
    enable-after-script: true
    enable-group: true
    enable-response-code: true
    enable-reload-cache-parameter: false
    enable-debug: true
    enable-home-custom: false
    home-custom-path: classpath:markdown/home.md
    enable-version: true
    enable-footer: false
    enable-footer-custom: false
    footer-custom-content: "自定义Footer内容"

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
    resolve-schema-properties: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: list
    display-request-duration: true
  paths-to-exclude: /error, /actuator/**
  cache:
    disabled: false
  show-actuator: false
  show-login-endpoint: false
  group-configs:
    -
      group: 'Feign接口'
      displayName: 'Feign 接口（服务间调用）'
      packagesToScan: com.carlos.devkit.apiimpl
      pathsToMatch: /**
