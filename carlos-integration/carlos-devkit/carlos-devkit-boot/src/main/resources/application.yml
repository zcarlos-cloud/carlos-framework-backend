# ==========================================
# carlos-devkit-boot 开发工具平台单体启动配置
# 说明：模板存 PostgreSQL（dev_* 表），渲染沙箱走本地临时目录，产物经 zip 流直出浏览器
# ==========================================

# ======================== 服务基础配置 ========================
server:
  port: ${SERVER_PORT:9520}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 128KB
  tomcat:
    threads:
      max: 32
  servlet:
    context-path: /

# ======================== Spring 主配置 ========================
spring:
  profiles:
    active: env,boot
  application:
    name: carlos-devkit

  # ======================== 数据源配置（Druid + 动态数据源） ========================
  datasource:
    druid:
      stat-view-servlet:
        enabled: true
        # 控制台口令必须走环境变量，禁止默认弱口令
        loginUsername: ${DRUID_CONSOLE_USERNAME:admin}
        loginPassword: ${DRUID_CONSOLE_PASSWORD:}
    dynamic:
      primary: master
      # 严格匹配数据源，默认 false。true 未匹配到指定数据源时抛异常，false 使用默认数据源
      strict: false
      druid:
        initial-size: 5
        min-idle: 5
        max-active: 20
        max-wait: 60000
        time-between-eviction-runs-millis: 60000
        min-evictable-idle-time-millis: 300000
        validation-query: SELECT 1
        test-while-idle: true
        test-on-borrow: false
        test-on-return: false
        pool-prepared-statements: true
        break-after-acquire-failure: true
        connection-error-retry-attempts: 2
        max-pool-prepared-statement-per-connection-size: 20
        connection-properties:
          druid.stat.mergeSql: true
          druid.stat.slowSqlMillis: 5000

# ======================== Carlos 框架配置 ========================
carlos:
  # ======================== 资源服务器/安全配置 ========================
  # 校验网关签发的身份断言（X-User-Context），建立登录人上下文（审计记录操作人的前提）
  resource-server:
    enabled: true
  # ======================== 加密配置（SM4 国密，数据源口令加密必需） ========================
  encrypt:
    sm4:
      enabled: true
      encrypt-mode: cbc
      key: ${CARLOS_ENCRYPT_KEY:asdfghjklmnbvcxz}
      iv: ${CARLOS_ENCRYPT_IV:mnbvcxzpoiuytre1}
  web:
    cors:
      enabled: true
    # 枚举字典配置（@AppEnum 的 code 需全局唯一，只扫本服务自己的枚举包）
    enum-dict:
      scan-packages: com.carlos.devkit
      enabled: true

  # ======================== MyBatis 实体 fill 注解启动期校验 ========================
  mybatis:
    entity-packages:
      - com.carlos.devkit

  # ======================== 雪花 ID 配置 ========================
  snowflake:
    tag: devkit

  # ======================== 开发工具平台配置（详见 DevkitProperties） ========================
  devkit:
    # 渲染沙箱根目录（请求级子目录，用完即删）
    tmp-root: ${CARLOS_DEVKIT_TMP_ROOT:}
    # 单次生成产物大小上限（字节），默认 50MB
    max-output-size: 52428800
    # 单次生成产物文件数上限
    max-file-count: 2000
    # 单个模板渲染超时（毫秒）
    render-timeout-ms: 10000
    # 目标库元数据读取（连接/语句）超时（秒）
    meta-timeout-sec: 10
    # 单个模板保留的历史版本数
    template-max-versions: 50

# ======================== MyBatis-Plus 配置 ========================
mybatis-plus:
  check-config-location: false
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    call-setters-on-nulls: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*Mapper.xml

# ======================== 监控配置（Actuator） ========================
management:
  endpoints:
    web:
      exposure:
        include: "*"

# ======================== 日志配置 ========================
logging:
  config: classpath:config/logback.xml
  level:
    root: info
    com.carlos: debug
  file:
    path: logs/devkit/

---
# ======================== 接口文档配置（Knife4j/SpringDoc） ========================
carlos:
  openapi:
    enable: true
    title: "Carlos 开发工具平台 API 文档"
    description: "代码生成器 / 工程生成器 / 模板管理接口"
    version: "3.0.0"
    contact:
      name: "技术支持"
      email: "13032820513@163.com"
      url: "http://www.zcarlos.com"
    license: "Apache 2.0"
    license-url: "https://www.apache.org/licenses/LICENSE-2.0"

knife4j:
  enable: true
  production: false
  basic:
    enable: false
    username: admin
    password: 123456
  setting:
    language: ZH_CN
    enable-document-manage: true
    enable-swagger-models: true
    swagger-model-name: Swagger Models
    enable-host: true
    enable-request-cache: true
    enable-filter-multipart-apis: true
    enable-filter-multipart-api-method-type: POST
    enable-dynamic-parameter: true
    enable-open-api: true
    enable-search: true
    enable-after-script: true
    enable-group: true
    enable-response-code: true
    enable-reload-cache-parameter: false
    enable-debug: true
    enable-home-custom: false
    home-custom-path: classpath:markdown/home.md
    enable-version: true
    enable-footer: false
    enable-footer-custom: false
    footer-custom-content: "自定义Footer内容"

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
    resolve-schema-properties: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: list
    display-request-duration: true
  paths-to-exclude: /error, /actuator/**
  cache:
    disabled: false
  show-actuator: false
  show-login-endpoint: false
  # ==================== 接口分组 ====================
  group-configs:
    # Feign 接口（服务间调用）
    -
      group: 'Feign接口'
      displayName: 'Feign 接口（服务间调用）'
      packagesToScan: com.carlos.devkit.apiimpl
      pathsToMatch: /**
