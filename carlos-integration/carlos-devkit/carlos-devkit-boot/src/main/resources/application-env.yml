# ==========================================
# carlos-devkit-boot 本地开发环境变量配置
# 说明：仅用于本地开发，生产环境通过系统环境变量或 Nacos 配置中心提供
# 警告：此文件不应包含真实密码，提交前请确认已使用占位符
# ==========================================

# ======================== 数据库配置（PostgreSQL 元数据库） ========================
DB_URL: ${CARLOS_DB_URL:localhost:5432/carlos_framework}
DB_USERNAME: ${CARLOS_DB_USERNAME:postgres}
DB_PWD: ${CARLOS_DB_PASSWORD:}

# ======================== Redis 配置（框架基线装配 RedissonClient，必须可达） ========================
# 需要密码时另外给 SPRING_DATA_REDIS_PASSWORD（不要用本文件的空占位，见 application-boot.yml 注释）
REDIS_IP: ${CARLOS_REDIS_HOST:localhost}
REDIS_PORT: ${CARLOS_REDIS_PORT:16379}
REDIS_DB: ${CARLOS_REDIS_DB:0}
