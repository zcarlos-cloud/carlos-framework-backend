# ======================== Knife4j 网关聚合配置 ========================
knife4j:
  gateway:
    enabled: true
    # 标签排序方式
    tags-sorter: order
    # 操作排序方式
    operations-sorter: order
    # 发现模式：discover（自动发现）、manual（手动配置）
    strategy: discover
    discover:
      service-config:
        carlos-auth:
          context-path: ""
          skip-route-prefix: true
        carlos-org:
          context-path: ""
          skip-route-prefix: true
          group-names:
            - org-feign-apis
            - org-base-manage
            - org-position-manage



# ======================== 日志配置 ========================
logging:
  config: classpath:config/logback.xml
  level:
    root: info
    com.carlos: debug
    # Spring Security 日志
    org.springframework.security: debug
    # Gateway 日志
    org.springframework.cloud.gateway: DEBUG
    # Knife4j 日志
    com.github.xiaoymin.knife4j: debug
    com.github.xingfudeshi.knife4j: debug
  file:
    path: logs/gateway

# ======================== 监控配置（Actuator + Micrometer） ========================
management:
  # ======================== 链路追踪 ========================
  tracing:
    sampling:
      # 采样概率（1.0 = 100%，生产环境建议 0.1）
      probability: 1.0
    export:
      # Zipkin 上报
      zipkin:
        # Zipkin 服务端点
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
      enabled: true

  # ======================== 端点配置 ========================
  endpoints:
    web:
      exposure:
        # 暴露的端点
        include: health,info,metrics,prometheus,gateway
    health:
      # 健康检查展示详情
      show-details: when-authorized
    gateway:
      enabled: true

  # ======================== Prometheus 指标配置 ========================
  metrics:
    tags:
      # 应用标签
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
        step: 30s
