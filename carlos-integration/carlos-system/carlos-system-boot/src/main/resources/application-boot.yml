# ==========================================
# carlos-system-boot 本地数据源补充配置
# 说明：补充 boot profile 下的数据库连接、MinIO、Redis 等配置
# ==========================================

# ======================== 数据源配置 ========================
spring:
  datasource:
    dynamic:
      primary: master
      datasource:
        # 主库数据源
        master:
          driver-class-name: org.postgresql.Driver
          url: jdbc:postgresql://${DB_URL}?currentSchema=public&stringtype=unspecified
          username: ${DB_USERNAME}
          password: ${DB_PWD}

---
# ======================== 系统文件管理配置 ========================
carlos:
  system:
    file:
      # 文件访问基础 URL
      base-url: ${SYSTEM_FILE_BASE_URL:http://127.0.0.1:9511}
      # 支持的文件扩展名
      support-ext: pdf,ext,doc,docx,xls,xlsx,png,jpg,jpeg,gif,csv,zip,txt
      # 最大文件大小
      max-file-size: 100MB
      # 上传超时时间（秒）
      upload-timeout-seconds: 60

  # ======================== 对象存储配置（MinIO） ========================
  minio:
    # 是否启用 MinIO
    enabled: true
    # MinIO 服务端点
    endpoint: ${MINIO_HOST}
    # 公网访问端点
    public-endpoint: ${MINIO_PUBLIC_HOST}
    # 访问密钥
    access-key: ${MINIO_USERNAME}
    # 秘密密钥
    secret-key: ${MINIO_PWD}
    # 默认 Bucket
    bucket: carlos-default
    # 连接超时
    connect-timeout: 10s
    # 写入超时
    write-timeout: 60s
    # 读取超时
    read-timeout: 10s
    # 启动时检查 Bucket 是否存在
    check-bucket: true
    # 自动创建 Bucket
    create-bucket: true

---
# ======================== 缓存数据库配置（Redis） ========================
spring:
  cache:
    type: redis
  redis:
    # Redis 数据库索引
    database: ${REDIS_DB}
    # Redis 服务器地址
    host: ${REDIS_IP}
    # Redis 服务器端口
    port: ${REDIS_PORT}
    # Redis 密码
    password: ${REDIS_PWD}
    lettuce:
      pool:
        # 最大活跃连接数
        max-active: 50
        # 最大空闲连接数
        max-idle: 100
        # 最大等待时间
        max-wait: 30s
        # 最小空闲连接数
        min-idle: 0
      # 关闭超时
      shutdown-timeout: 100ms

---
# ======================== MyBatis 实体 fill 注解启动期校验 ========================
carlos:
  mybatis:
    # 实体包扫描路径：启动时校验实体上 fill 注解的字段是否可自动填充（error 告警不阻断）
    entity-packages:
      - com.carlos.system
