# ==========================================
# carlos-message-cloud 微服务启动配置
# 说明：消息中心 Spring Cloud 版本，通过 Nacos 获取共享配置
# ==========================================

# ======================== 服务基础配置 ========================
server:
  port: 9515

# ======================== Spring 主配置 ========================
spring:
  profiles:
    active: ${PROFILE:local}
  application:
    name: carlos-message

  # ======================== Nacos 配置中心 ========================
  cloud:
    nacos:
      discovery:
        enabled: true
      config:
        enabled: true
        file-extension: yml
        refresh-enabled: true

  # 配置导入（Nacos 共享配置）
  config:
    import:
      # 1. 公共配置（所有环境共享）
      # 2. Redis 共享配置
      # 3. 数据库共享配置
      - optional:nacos:common.yml?group=DEFAULT_GROUP&refreshEnabled=true
      - optional:nacos:redis.yml?group=DEFAULT_GROUP&refreshEnabled=true
      - optional:nacos:db.yml?group=DEFAULT_GROUP&refreshEnabled=true

  # ======================== 邮件服务配置 ========================
  mail:
    # SMTP 服务器主机
    host: ${MAIL_HOST:smtp.example.com}
    # SMTP 服务器端口
    port: ${MAIL_PORT:465}
    # 邮箱账号
    username: ${MAIL_USERNAME:}
    # 邮箱密码（建议使用 SMTP 授权码）
    password: ${MAIL_PASSWORD:}
    # 默认编码
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          # 是否启用 SSL
          ssl:
            enabled: true
          # 是否启用认证
          auth: true
          # 连接超时
          connectiontimeout: 5000
          # 读取超时
          timeout: 5000
          # 写入超时
          writetimeout: 5000

# ======================== 本地调试环境 ========================
---
spring:
  config:
    activate:
      on-profile: local
  cloud:
    nacos:
      username: ${NACOS_USERNAME:@nacos.username@}
      password: ${NACOS_PASSWORD:@nacos.password@}
      discovery:
        server-addr: ${NACOS_ADDR:@nacos.addr@}
        namespace: ${NACOS_NAMESPACE:@nacos.namespace@}
        group: ${NACOS_GROUP:@nacos.group@}
      config:
        server-addr: ${NACOS_ADDR:@nacos.addr@}
        namespace: ${NACOS_NAMESPACE:@nacos.namespace@}
        group: ${NACOS_GROUP:@nacos.group@}

# ======================== 部署环境（使用环境变量） ========================
---
spring:
  config:
    activate:
      on-profile: deploy
  cloud:
    nacos:
      username: ${NACOS_USERNAME}
      password: ${NACOS_PASSWORD}
      discovery:
        server-addr: ${NACOS_ADDR}
        namespace: ${NACOS_NAMESPACE}
        group: ${NACOS_GROUP}
      config:
        namespace: ${NACOS_NAMESPACE}
        server-addr: ${NACOS_ADDR}
        group: ${NACOS_GROUP}

---
# ======================== Carlos 消息中心配置 ========================
carlos:
  # ======================== 资源服务器/安全配置 ========================
  # 开启后挂载 UserContextAuthenticationFilter：校验网关签发的身份断言（X-User-Context），
  # 并在本服务内建立登录人上下文。这是 @Log 审计日志能记录「操作人」的前提 ——
  # 关闭时审计行会记成 principalType=ANONYMOUS、操作人为空。
  # 注意：该过滤器链是 anyRequest().permitAll()，不收紧任何准入；准入权威仍在网关。
  resource-server:
    enabled: true
  # APM 链路追踪（Brave + MDC 日志关联）
  apm:
    enabled: true
  # ======================== 枚举字典配置（`GET /app/enums`、`GET /app/enum` 的数据源） ========================
  web:
    enum-dict:
      # 只扫本服务自己的枚举包（@AppEnum 的 code 需全局唯一，扫 com.carlos 会跨模块互相覆盖）
      scan-packages: com.carlos.message
      enabled: true
  message:
    enabled: true
    # consumer-id / queue.type / queue.stream-prefix / queue.consumer-count 均为零读取的死配置
    # （详见 MessageProperties 类注释），已移除。
    queue:
      enabled: true
    rate-limiter:
      enabled: true
      default-qps: 100
    retry:
      max-attempts: 3
      initial-interval: 1000
      multiplier: 2

  # 邮件服务配置已上移到 spring.mail（见上文 Spring 主配置），
  # 放在 carlos.* 下不会生效，会导致 JavaMailSender 缺失、EmailChannelAdapter 装配失败。

  # 短信配置
  sms:
    templates:
      verification:
        template-id: ${SMS_VERIFICATION_TEMPLATE:}
        sign-name: ${SMS_SIGN_NAME:}

  # 钉钉集成
  integration:
    dingtalk:
      enabled: ${DINGTALK_ENABLED:false}
      host: ${DINGTALK_HOST:https://oapi.dingtalk.com}
      appkey: ${DINGTALK_APPKEY:}
      appsecret: ${DINGTALK_APPSECRET:}

# ======================== 日志配置 ========================
logging:
  config: classpath:config/logback.xml
  level:
    com.carlos: debug
  file:
    path: logs/message

# ======================== 监控配置 ========================
management:
  endpoints:
    web:
      exposure:
        include: "*"
